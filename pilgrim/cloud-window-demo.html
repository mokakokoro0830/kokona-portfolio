<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Window Cloud Motion Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06101b;color:#eafaff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.stage{width:min(100vw,1672px);position:relative;aspect-ratio:1672/941;overflow:hidden;background:#07111e}
.sky-layer{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:url("img/window-sky-user-strip.webp");background-size:auto 100%;background-repeat:repeat-x;background-position:0 50%;animation:skyDrift 150s linear infinite}
.sky-layer--near{opacity:.28;mix-blend-mode:screen;filter:saturate(1.35) brightness(1.18) blur(.25px);background-size:auto 112%;animation-duration:82s;animation-direction:reverse}
.foreground{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;pointer-events:none}
.shade{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.24),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 72%,rgba(0,0,0,.2)),radial-gradient(circle at 50% 46%,rgba(88,236,255,.14),rgba(2,8,20,0) 38%)}
.label{position:fixed;left:16px;bottom:14px;z-index:4;margin:0;padding:8px 12px;border:1px solid rgba(140,235,255,.42);background:rgba(3,10,18,.72);backdrop-filter:blur(10px);font-size:13px;line-height:1.5;color:#dffbff}
@keyframes skyDrift{
 from{background-position-x:0}
 to{background-position-x:-3344px}
}
@media(prefers-reduced-motion:reduce){
 .sky-layer{animation:none}
}
</style>
</head>
<body>
<main class="stage" aria-label="分離した空と建物を重ねて動かすデモ">
 <div class="sky-layer" aria-hidden="true"></div>
 <div class="sky-layer sky-layer--near" aria-hidden="true"></div>
 <img class="foreground" src="img/window-foreground-cutout.png" alt="">
 <div class="shade" aria-hidden="true"></div>
</main>
<p class="label">後ろの空だけを動かして、手前の建物は固定しています。</p>
</body>
</html>
